apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "judex.name" . }}
  labels: {{ include "judex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: judex, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {{ include "judex.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: JUDEX_ENV, value: {{ .Values.environment | quote }}}
            - {name: JUDEX_HTTP_ADDR, value: "0.0.0.0:8080"}
            - {name: JUDEX_WEB_DIR, value: /app/web}
            # Reserved connection contract; the scaffold reports persistence=false.
            - {name: JUDEX_POSTGRES_HOST, value: {{ include "judex.pgHost" . | quote }}}
            - {name: JUDEX_POSTGRES_DATABASE, value: {{ .Values.postgresql.database | quote }}}
            - {name: JUDEX_POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - {name: JUDEX_POSTGRES_PORT, value: {{ .Values.postgresql.embedded.enabled | ternary "5432" (.Values.postgresql.external.port | toString) | quote }}}
            - {name: JUDEX_POSTGRES_SSLMODE, value: {{ .Values.postgresql.embedded.enabled | ternary "disable" .Values.postgresql.external.sslMode | quote }}}
            - name: JUDEX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "judex.pgSecret" . }}, key: password}
            - name: JUDEX_S3_ENDPOINT
              value: {{ if .Values.objectStorage.embedded.enabled }}"http://{{ .Release.Name }}-seaweedfs:8333"{{ else }}{{ .Values.objectStorage.external.endpoint | quote }}{{ end }}
            - name: JUDEX_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "judex.storageSecret" . }}, key: access-key}
            - name: JUDEX_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "judex.storageSecret" . }}, key: secret-key}
            - {name: JUDEX_S3_REGION, value: {{ .Values.objectStorage.external.region | quote }}}
            - {name: JUDEX_S3_BUCKET, value: {{ .Values.objectStorage.embedded.enabled | ternary "judex" .Values.objectStorage.external.bucket | quote }}}
            {{- if .Values.sandbox.enabled }}
            - {name: JUDEX_OPENSANDBOX_ENDPOINT, value: "http://{{ printf "%s-%s-opensandbox-server" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}:80"}
            - name: JUDEX_OPENSANDBOX_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.sandboxAPIKeySecret }}, key: api-key}
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "judex.name" . }}
  labels: {{ include "judex.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: judex, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
