{{- if .Values.postgresql.embedded.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: judex-postgresql, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: judex-postgresql, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: judex-postgresql, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgresql.embedded.image }}
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "judex.pgSecret" . }}, key: password}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations: {helm.sh/resource-policy: keep}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgresql.embedded.storageClass }}
        storageClassName: {{ .Values.postgresql.embedded.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgresql.embedded.storage }}}
{{- end }}
