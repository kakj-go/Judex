{{- if and .Values.postgresql.embedded.enabled (not .Values.postgresql.existingSecret) }}
{{- $name := printf "%s-postgresql" .Release.Name }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  password: {{ if $old }}{{ index $old.data "password" }}{{ else }}{{ randAlphaNum 40 | b64enc | quote }}{{ end }}
---
{{- end }}
{{- if .Values.objectStorage.embedded.enabled }}
{{- $old := lookup "v1" "Secret" .Release.Namespace "judex-storage-auth" }}
{{- $access := randAlphaNum 24 }}
{{- $secret := randAlphaNum 48 }}
apiVersion: v1
kind: Secret
metadata:
  name: judex-storage-auth
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  {{- if $old }}
  {{- toYaml $old.data | nindent 2 }}
  {{- else }}
  access-key: {{ $access | b64enc | quote }}
  secret-key: {{ $secret | b64enc | quote }}
  seaweedfs_s3_config: {{ dict "identities" (list (dict "name" "judex-platform" "credentials" (list (dict "accessKey" $access "secretKey" $secret)) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.sandbox.enabled .Values.global.sandboxAPIKeyManaged }}
{{- $old := lookup "v1" "Secret" .Release.Namespace .Values.global.sandboxAPIKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.sandboxAPIKeySecret }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  api-key: {{ if $old }}{{ index $old.data "api-key" }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
{{- end }}
