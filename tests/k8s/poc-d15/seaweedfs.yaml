# D15 挂载 PoC：SeaweedFS 单实例（master+volume+filer+s3 单进程）
# 拓扑来自 deploy/helm/judex/templates/seaweedfs.yaml 的 compact 方案，独立部署到临时 namespace。
# PoC 用 emptyDir，不测持久化；只读挂载 / 动态可见性 / 并发只读为验证目标。
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: judex-poc-d15
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {"identities":[{"name":"judex-poc","credentials":[{"accessKey":"pocaccess","secretKey":"pocsecretkey123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: judex-poc-d15
spec:
  selector: {app: seaweedfs-poc}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
    - {name: master, port: 9333, targetPort: 9333}
    - {name: master-grpc, port: 19333, targetPort: 19333}
    - {name: filer, port: 8888, targetPort: 8888}
    - {name: filer-grpc, port: 18888, targetPort: 18888}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: judex-poc-d15
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: {app: seaweedfs-poc}
  template:
    metadata:
      labels: {app: seaweedfs-poc}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          command: [/usr/bin/weed]
          args:
            - server
            - -dir=/data
            - -master
            - -volume
            - -ip=$(POD_IP)
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=1024
            - -filer
            - -filer.port=8888
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/seaweedfs_s3_config
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: WEED_LEVELDB2_ENABLED, value: "true"}
            - {name: WEED_LEVELDB2_DIR, value: /data/filer}
          ports: [{containerPort: 8333}, {containerPort: 9333}, {containerPort: 8888}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe: {httpGet: {path: /cluster/status, port: 9333}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: 8333}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /cluster/status, port: 9333}, periodSeconds: 15}
      volumes:
        - name: config
          secret: {secretName: seaweedfs-s3-config}
        - name: data
          emptyDir: {}
