# D15 PoC B：外部 S3 通用路径 —— rclone 只读挂载 S3 网关桶
# 模拟生产"外部 S3 模式"的适配层：不走 SeaweedFS 原生 Filer/CSI，
# 仅用标准 S3 API（endpoint 指向 SeaweedFS S3 网关，等同于任意外部 S3 服务）。
# 数据播种经 filer API（本环境 S3 PUT 受 all-in-one 卷槽位限制，见 README 踩坑）。
# --dir-cache-time 15s：目录列表缓存 TTL（生产可按可见性要求调整，权衡请求量）。
apiVersion: v1
kind: Pod
metadata:
  name: extmount
  namespace: judex-poc-d15
  labels: {poc-role: ext-mount}
spec:
  restartPolicy: Never
  containers:
    - name: rclone
      image: rclone/rclone:1.68.2
      command: ["sh", "-c"]
      args:
        - mkdir -p /workspace/project && rclone mount --read-only --dir-cache-time 15s --vfs-cache-mode off s3ext:ext-share /workspace/project 2>/tmp/mount.log & sleep 3600
      env:
        - {name: RCLONE_CONFIG_S3EXT_TYPE, value: s3}
        - {name: RCLONE_CONFIG_S3EXT_PROVIDER, value: Other}
        - {name: RCLONE_CONFIG_S3EXT_ENDPOINT, value: "http://seaweedfs.judex-poc-d15:8333"}
        - {name: RCLONE_CONFIG_S3EXT_ACCESS_KEY_ID, value: pocaccess}
        - {name: RCLONE_CONFIG_S3EXT_SECRET_ACCESS_KEY, value: pocsecretkey123}
        - {name: RCLONE_CONFIG_S3EXT_REGION, value: us-east-1}
      securityContext: {privileged: true}
