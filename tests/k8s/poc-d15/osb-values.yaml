# D15 PoC：OpenSandbox 全组件（controller + CRD + server）
# 初次尝试时集群曾有其他 release 的 CRD（已随该项目卸载），现由本 release 安装自己的 CRD。
# 关键点：kubernetes.namespace 必须指向本 PoC namespace（默认 opensandbox 不存在会导致 K8s API 404）
opensandbox-controller:
  controller:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
opensandbox-server:
  server:
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  configToml: |
    [server]
    host = "0.0.0.0"
    port = 80
    api_key = "poc-d15-api-key"

    [log]
    level = "INFO"

    [runtime]
    type = "kubernetes"
    execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:v1.0.22"

    [kubernetes]
    kubeconfig_path = ""
    namespace = "judex-poc-d15"
    informer_enabled = true
    informer_resync_seconds = 300
    informer_watch_timeout_seconds = 60
    snapshot_create_timeout_seconds = 900
    workload_provider = "batchsandbox"
    batchsandbox_template_file = "/etc/opensandbox/example.batchsandbox-template.yaml"

    [egress]
    image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:v1.1.6"
    mode = "dns+nft"
