# D15 挂载 PoC：两个模拟沙箱 Pod，共享同一 PVC 只读挂载
# 对应正式设计：/workspace/project 只读挂载本项目共享区
apiVersion: v1
kind: Pod
metadata:
  name: sandbox-a
  namespace: judex-poc-d15
  labels: {poc-role: sandbox}
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - {name: project, mountPath: /workspace/project, readOnly: true}
  volumes:
    - name: project
      persistentVolumeClaim: {claimName: poc-project-p1}
---
apiVersion: v1
kind: Pod
metadata:
  name: sandbox-b
  namespace: judex-poc-d15
  labels: {poc-role: sandbox}
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - {name: project, mountPath: /workspace/project, readOnly: true}
  volumes:
    - name: project
      persistentVolumeClaim: {claimName: poc-project-p1}
